      E.offers(game).forEach((id, i) => {
        const data = E.CARDS[id], button = document.createElement('button'); button.className = 'card'; button.disabled = !E.canChoose(game, id); button.dataset.card = id; button.title = data.detail;
        button.style.setProperty('--card-index',i);
        button.dataset.tone = id==='shield'?'jade':id.includes('archer')?'olive':id==='training'?'gold':'red';
        const impact={siege:['＋1','REAR SIEGE'],legion:['＋1','INFANTRY'],archer:['＋1','ARCHERS'],training:['＋25%','ADJACENT ATTACK'],legionTrain:['＋25%','INFANTRY ATTACK'],archerTrain:['＋25%','ARCHER ATTACK'],shield:['＋40','ARMY SHIELD']}[id];
        button.setAttribute('aria-label', `Choose ${data.name}: ${data.text}`);
        const suits={siege:'♦',legion:'♠',archer:'♣',training:'♦',legionTrain:'♠',archerTrain:'♣',shield:'♥'},ranks=['A','II','III'];
        button.innerHTML=`<span class="card-corner"><b>${ranks[i]}</b><em>${suits[id]}</em></span><span class="card-corner reverse" aria-hidden="true"><b>${ranks[i]}</b><em>${suits[id]}</em></span><span class="card-art" aria-hidden="true"></span><span class="card-copy"><h3 class="px">${data.name}</h3><span class="card-rule" aria-hidden="true">◆</span><span class="card-impact"><b>${impact[0]}</b><span class="px">${impact[1]}</span></span></span>`;
        button.querySelector('.card-art').appendChild(cardArt(id));
        button.addEventListener('pointerenter',()=>{if(!selecting&&!button.disabled)beep('hover');});
        button.addEventListener('focus',()=>{if(!selecting&&!button.disabled)beep('hover');});
        button.addEventListener('click', () => {
          if(selecting||!E.canChoose(game,id))return;
          selecting=true;beep('select');button.classList.add('chosen');
          document.querySelectorAll('.card').forEach(c=>{c.disabled=true;if(c!==button)c.classList.add('dismissed');});
          $('skip').disabled=true;const epoch=generation;
          selectionTimer=setTimeout(()=>{
            if(epoch!==generation)return;selecting=false;$('skip').disabled=false;
            if(E.choose(game,id)){render();if(game.phase==='prepare'){beep('upgrade');callout(id==='shield'?'ARMY SHIELD ＋40':'Attack ＋25%','');}}
          },reducedMotion.matches?0:260);
        }); $('cards').appendChild(button);
      });
    } else {
      $('ready-icon').replaceChildren(makeIcon(game.chosen || 'eagle'));
      $('ready-title').textContent = game.chosen ? E.CARDS[game.chosen].name : '';
    }
  }
  function renderStatus(){
    const phase=game.phase,battle=phase==='battle',post=['result','defeat'].includes(phase);document.body.dataset.phase=phase;
    $('year').textContent='YEAR '+game.round;
    $('life-status').textContent=`Camp lives: ${game.defense} / ${E.MAX_LIVES}`;
    $('battlefield').setAttribute('aria-label',`Shared battlefield. Camp lives: ${game.defense} of ${E.MAX_LIVES}.`);
    $('pause').hidden=!battle;$('pause').textContent=paused?'▶':'Ⅱ';$('pause').setAttribute('aria-label',paused?'Resume battle':'Pause battle');$('paused-banner').hidden=!(battle&&paused);
    $('speed').hidden=!battle;$('speed').textContent=speed+'×';$('timer').hidden=!battle;$('timer').textContent='00:'+Math.floor(game.battle?.time||0).toString().padStart(2,'0');
    $('start-battle').hidden=phase!=='prepare'&&!post;$('start-battle').setAttribute('aria-label',post?'View report':'MARCH');$('start-battle').innerHTML=`<span class="px">${post?'Report':'MARCH'}</span><b>${post?'◆':'⚔'}</b>`;pixelize();
  }
  function render(){renderCamp();renderInspector();renderSupply();renderStatus();pixelize();drawBattle();}
  function drawBattle() {
    const c=ctx;c.imageSmoothingEnabled=false;c.drawImage(terrain,0,0);fx.drawGround(c);
    const battle=game.battle,positions=battle?BV.layout(battle.units):null,queue=[],overlay=[],put=(x,y,draw)=>queue.push({depth:I.project(x,y).y,draw});
    // The camera projects feet only. Vertical bodies, walls and poles stay upright.
    // Broken woodland at the outer map edge leaves the central plain open.
    for(let n=0;n<29;n++){if(n%9===4||n%9===5)continue;const x=-650+n*110,y=-550+Math.sin(n*2.3)*65;put(x,y,()=>I.tree(c,x,y,.95+(n%5)*.10));}
    for(let n=0;n<27;n++){if(n%8===2||n%8===3)continue;const x=-650+n*118,y=1580+Math.sin(n*1.7)*75;put(x,y,()=>I.tree(c,x,y,1.0+(n%4)*.12));}
    for(let n=0;n<15;n++){if(n%6===2||n%6===3)continue;const y=-400+n*145,left=-650+Math.sin(n)*30,right=2380+Math.cos(n*1.8)*55;put(left,y,()=>I.tree(c,left,y,1.25));put(right,y,()=>I.tree(c,right,y,1.2));}
    // Three shields belong to the world, behind the center of the rear palisade.
    for(let i=0;i<E.MAX_LIVES;i++){const x=-25,y=380+i*66;put(x,y,()=>I.lifeShield(c,x,y,i<game.defense));}
    const post=(x,y)=>put(x,y,()=>{I.box(c,x,y,8,8,32,'#a7b9a2','#708875','#405b4e');});
    for(let x=65;x<560;x+=25){post(x,244);if(x<175||x>420)post(x,645);}
    for(let y=270;y<640;y+=27)post(62,y);
    for(const [x,y]of [[560,244],[560,645]])put(x,y,()=>{I.box(c,x-12,y-12,25,25,30,'#a8b7a3','#7b927e','#516e60');const p=I.project(x,y);flag(c,p.x,p.y-30,'#762e25',.8*MODEL_SCALE);});
    for(const [x,y]of [[175,697],[208,697],[241,697]])put(x,y,()=>{I.box(c,x,y,24,22,21,'#91a68c','#627c67','#3f5b4d');I.box(c,x+10,y,3,22,23,'#b2c2a7','#99ad91','#708b73');});
    for(let i=0;i<12;i++){
      const b=game.buildings.find(b=>b.cell===i),pos=I.cellCenter(i),p=I.project(pos.x,pos.y),focus=game.buildings.find(b=>b.id===selected);
      if(!battle){const valid=game.phase==='place'?(!b||(b.type===game.pending&&b.level<3)):false;
        const active=i===hoverCell||b?.id===selected,affected=focus?.type==='training'&&b&&E.adjacent(focus.cell,i);
        I.poly(c,I.cellPolygon(i,3),active?'#f9d68d38':affected?'#edcf7030':valid?'#e3d7a020':null,active?'#fff1be':valid?'#ecce88':'#e8d3a040');
        if(!b&&valid){c.fillStyle='#f2d798';c.fillRect(p.x-4,p.y,9,2);c.fillRect(p.x,p.y-4,2,9);}
      }
      if(b)put(pos.x,pos.y,()=>{const lift=b.id===selected&&!battle?4:0;c.drawImage(buildingSprite(b.type,b.level),p.x-53*MODEL_SCALE,p.y-91*MODEL_SCALE-lift,106*MODEL_SCALE,106*MODEL_SCALE);if(!battle){c.font='12px Georgia';c.textAlign='center';c.fillStyle='#443d2c';c.fillText(['','Ⅰ','Ⅱ','Ⅲ'][b.level],p.x-22,p.y+13);}});
    }
    function enqueueSquad(x,y,type,dir,id=-1,moving=false,flash=false,attackAge=10,route=null){
      if(type==='siege'){const p=I.project(x,y);put(x,y,()=>{c.save();if(route)c.globalAlpha=Math.max(0,1-route.age/1.1);c.translate(p.x-42*MODEL_SCALE,p.y-69*MODEL_SCALE);c.scale(1.3*MODEL_SCALE,1.3*MODEL_SCALE);I.catapult(c,attackAge);c.restore();});return;}
      BV.formation.forEach((slot,i)=>{const age=route?.age||0,scatter=route?-dir*Math.min(1,age/.65)*(18+slot.column*14):0,wx=x+slot.dx*dir*MODEL_SCALE+scatter,wy=y+slot.dy*MODEL_SCALE+(route?(i%3-1)*age*25:0),p=I.project(wx,wy);
        const pose=BV.pose(fx.time+Math.max(id,0)*.04,i,moving,attackAge,reducedMotion.matches);if(slot.column>0)pose.slash=0;
        put(wx,wy,()=>{c.save();if(route)c.globalAlpha=Math.max(0,1-age/1.1);I.shadow(c,p.x,p.y,8,3);if(route&&i%3!==0){c.translate(p.x,p.y);c.rotate(-dir*Math.min(1,age/.35)*1.3);soldier(c,0,0,type,dir,0,false,.72*MODEL_SCALE,pose);}else soldier(c,p.x,p.y,type,route?-dir:dir,0,flash&&slot.column===0,.72*MODEL_SCALE,pose);c.restore();});
      });
      if(moving&&!reducedMotion.matches){const p=I.project(x-dir*50,y);put(x-dir*50,y,()=>{c.fillStyle='#d2bd8b50';for(let j=0;j<3;j++){const age=(fx.time*2+j*.3)%1;c.fillRect(p.x-dir*age*22,p.y+age*7+j*4,5,3);}});}
    }
    if(battle){
      for(const u of battle.units){
        const y=475+u.y*.9;
        if(u.hp<=0){const r=fx.routed(u.id);if(r&&r.age<1.1)enqueueSquad(r.worldX??595+u.x*.91,r.worldY??y,u.type,u.side==='ally'?1:-1,u.id,true,false,10,r);continue;}
        const x=positions.get(u.id)+fx.offset(u.id),dir=u.side==='ally'?1:-1,p=I.project(x,y);
        enqueueSquad(x,y,u.type,dir,u.id,u.moving&&game.phase==='battle',u.flash>0,fx.attackAge(u.id));
        overlay.push(()=>{pixels(c,p.x-22,p.y-49,44,5,'#253e32');pixels(c,p.x-21,p.y-48,42*u.hp/u.maxHp,3,u.side==='ally'?'#e6c980':'#acc5c9');if(u.shield>0)pixels(c,p.x-21,p.y-53,42*u.shield/40,2,'#c9eddb');});
      }
      for(const shot of battle.projectiles){const t=1-shot.life/shot.duration,groundX=595+(shot.from+(shot.to-shot.from)*t)*.91,groundY=475+(shot.fromY+(shot.toY-shot.fromY)*t)*.9,p=I.project(groundX,groundY,24+Math.sin(t*Math.PI)*(shot.siege?110:28));
        overlay.push(()=>{if(shot.siege){const g=I.project(groundX,groundY);c.fillStyle='#29372530';c.beginPath();c.ellipse(g.x,g.y,7,3,0,0,Math.PI*2);c.fill();pixels(c,p.x-5,p.y-4,10,8,'#51594f');pixels(c,p.x-4,p.y-5,7,4,'#c4c4aa');pixels(c,p.x+3,p.y,4,5,'#737d67');}else{const dir=shot.side==='ally'?1:-1;c.strokeStyle='#f6e7b8';c.lineWidth=2;c.beginPath();c.moveTo(p.x,p.y);c.lineTo(p.x+dir*15,p.y+dir*5);c.stroke();}});
      }
    }else{
      for(const u of E.muster(game)){const x=595+u.x*.91,y=475+u.y*.9;enqueueSquad(x,y,u.type,u.side==='ally'?1:-1);if(u.shield){const p=I.project(x,y);overlay.push(()=>{c.strokeStyle='#c5ead6';c.lineWidth=2;c.beginPath();c.ellipse(p.x,p.y,44,17,.3,0,Math.PI*2);c.stroke();});}}
    }
    queue.sort((a,b)=>a.depth-b.depth).forEach(item=>item.draw());I.atmosphere(c,fx.time,reducedMotion.matches);overlay.forEach(draw=>draw());fx.draw(c);
  }
  function showResult(){
    const defeat=game.phase==='defeat';
    $('result-emblem').replaceChildren(makeIcon(defeat?'shield':'legion'));
    $('result-title').textContent=defeat?'CAMPAIGN ENDED':game.battle?.report.won?'YEAR HELD':'LINE BREACHED';
    $('result-description').textContent=`YEAR ${game.round} · LIVES ${game.defense}/${E.MAX_LIVES}`;
    const report=game.battle?.report;
    $('report-rows').innerHTML=report?`<div class="report-row"><span class="px">ENEMY LOSSES</span><strong>${report.enemyLosses} / ${report.enemyCount}</strong></div><div class="report-row"><span class="px">SURVIVORS</span><strong>${report.surviving} / ${report.deployed}</strong></div><div class="report-row"><span class="px">CAMP LIVES</span><strong class="px ${report.defenseLost?'bad':'held'}">${report.defenseLost?'−'+report.defenseLost:'HELD'}</strong></div>`:'';
    $('continue').innerHTML=`<span class="px">${defeat?'New campaign':'Next year'}</span><b>→</b>`;
    if(!$('result-dialog').open)$('result-dialog').showModal();pixelize();
  }
  function reset(){cancelTransitions();$('skip').disabled=false;if($('result-dialog').open)$('result-dialog').close();game=E.createGame();selected=null;paused=false;accumulator=0;lastUiSecond=-1;lastDefense=3;render();beep();}
  $('skip').addEventListener('click',()=>{if(E.skip(game)){beep('click');render();}});
  reducedMotion.addEventListener('change',applyPrefs);
  $('pause').addEventListener('click', () => { if (game.phase === 'battle') { paused = !paused; accumulator = 0;if(paused)audio.stop();beep(); renderStatus(); } });
  $('speed').addEventListener('click', () => { speed = speed === 1 ? 2 : speed === 2 ? 4 : 1;beep(); renderStatus(); });
  $('start-battle').addEventListener('click', () => {
    if (['result', 'defeat'].includes(game.phase)) { showResult(); return; }
    if (E.start(game)) {  paused = false; accumulator = 0; lastUiSecond = -1;fx.clear();render();beep('horn');beep('cry');callout('LEGION, ADVANCE!'); }
  });
  $('inspect-result').addEventListener('click', () => {beep();$('result-dialog').close();});
  $('continue').addEventListener('click', () => { cancelTransitions();$('result-dialog').close(); if (game.phase === 'result') { E.next(game);  render(); beep(); } else reset(); });
  document.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='m'&&!e.repeat){prefs.enabled=!prefs.enabled;applyPrefs();toast(sound?'♫':'♫ ×');}});
  document.addEventListener('keydown', e => { if(!e.repeat&&begun&&game.phase==='reward'&&!document.querySelector('dialog[open]')&&/^[123]$/.test(e.key)&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){document.querySelectorAll('.card')[Number(e.key)-1]?.click();}  if (e.code === 'Space' && game.phase === 'battle' && !document.querySelector('dialog[open]') && !['BUTTON', 'INPUT'].includes(document.activeElement.tagName)) { e.preventDefault(); paused = !paused;accumulator=0;if(paused)audio.stop();renderStatus(); } });
  document.addEventListener('visibilitychange', () => { if (document.hidden && game.phase === 'battle') { paused = true; accumulator = 0;audio.stop(); renderStatus(); } });
  function frame(time) {
    const dt = Math.min((time - lastTime) / 1000 || 0, .1); lastTime = time;
    const suspended=paused||!!document.querySelector('dialog[open]')||document.hidden;
    fx.tick(dt,suspended);
    const shake=suspended?[0,0]:fx.shake();document.querySelector('.world').style.transform=`translate(${shake[0]}px,${shake[1]}px)`;
    if (begun && !fx.frozen && game.phase === 'battle' && !paused && !document.querySelector('dialog[open]') && !document.hidden) {
      accumulator += dt * speed * fx.tempo;fx.motion(game.battle.units);
      while (accumulator >= 1 / 30 && game.phase === 'battle') {
        const positions=BV.layout(game.battle.units);E.step(game,1/30);accumulator-=1/30;fx.consume(game.battle.events,positions);
        if(fx.frozen){accumulator=0;break;}
      }
      if (game.phase !== 'battle') { render();beep(game.phase === 'defeat' ? 'bad' : 'win');if(game.phase!=='defeat')beep('cry');const epoch=generation;resultTimer=setTimeout(()=>{if(epoch===generation&&!document.querySelector('dialog[open]'))showResult();},800); }
      else if (Math.floor(game.battle.time) !== lastUiSecond || lastDefense !== game.defense) {
        lastUiSecond = Math.floor(game.battle.time); if (lastDefense !== game.defense) { lastDefense = game.defense; } renderStatus(); 
      }
    }
    drawBattle(); requestAnimationFrame(frame);
  }
  applyPrefs();render();requestAnimationFrame(frame);
})();
